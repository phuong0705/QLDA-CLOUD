<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Cờ Tướng Online (Xiangqi Web)</title>
    <meta name="description" content="Đăng nhập tài khoản Cờ Tướng Online để thi đấu xếp hạng, so tài cùng các kỳ thủ.">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <main class="auth-container">
        <section class="auth-card">
            <header class="auth-header">
                <div class="auth-logo" aria-hidden="true">帥</div>
                <h1 class="auth-title">Đăng nhập tài khoản</h1>
                <p class="auth-subtitle">Chào mừng kỳ thủ quay trở lại võ đài cờ tướng</p>
            </header>

            <!-- Khu vực hiển thị thông báo lỗi / thành công (Không dùng window.alert) -->
            <div id="authAlert" class="auth-alert" style="display: none;" role="alert" aria-live="polite">
                <span class="auth-alert-icon" id="alertIcon">⚠️</span>
                <span id="alertMessage">Thông báo</span>
            </div>

            <!-- Form đăng nhập -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginInput" class="form-label">
                        Tên đăng nhập hoặc Email <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="loginInput" 
                        name="login" 
                        class="form-input" 
                        placeholder="Nhập username hoặc email" 
                        autocomplete="username" 
                        autofocus 
                        required 
                        aria-required="true"
                    >
                    <div id="loginError" class="field-error-text" aria-live="polite"></div>
                </div>

                <div class="form-group">
                    <label for="passwordInput" class="form-label">
                        Mật khẩu <span class="required-mark" aria-hidden="true">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="password" 
                        class="form-input" 
                        placeholder="Nhập mật khẩu của bạn" 
                        autocomplete="current-password" 
                        required 
                        aria-required="true"
                    >
                    <div id="passwordError" class="field-error-text" aria-live="polite"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span id="btnText">Đăng nhập</span>
                </button>
            </form>

            <footer class="auth-footer">
                Chưa có tài khoản? <a href="register.html" class="auth-link">Đăng ký ngay</a>
            </footer>
        </section>

        <a href="index.html" class="back-home">← Về trang chủ</a>
    </main>

    <!-- Scripts cần thiết cho quá trình xác thực -->
    <script src="js/auth/authManager.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/auth/login.js"></script>
</body>
</html>
